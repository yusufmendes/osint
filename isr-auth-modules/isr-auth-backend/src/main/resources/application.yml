server:
  port: 8081

spring:
  application:
    name: isr-auth-backend
  main:
    banner-mode: off

logging:
  level:
    root: INFO
    com.isr.auth: DEBUG

isr:
  auth:
    jwt-secret: dev-only-change-me-in-prod-please-change-this-to-something-long-enough-for-hs256
    jwt-ttl-minutes: 60
    cors-allowed-origins:
      - http://localhost:5173
      - http://localhost:5174
      - http://127.0.0.1:5173
    users:
      - username: admin
        password: admin123
        permissions:
          - gis.map.view
          - gis.layers.view
          - video.player.view
          - intelligence.crud.view
          - search.panel.view
      - username: viewer
        password: viewer123
        permissions:
          - gis.map.view
          - video.player.view
          - search.panel.view
